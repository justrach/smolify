name: Runner benchmark
on:
  push:
    branches: [codex/codegraff-runner-benchmark]
permissions:
  contents: read
jobs:
  matched-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: node:24.14.1-bookworm@sha256:80fc934952c8f1b2b4d39907af7211f8a9fff1a4c2cf673fb49099292c251cec
      options: --cpus 4 --memory 16g
    env:
      BENCHMARK_PROVIDER: github
      BENCHMARK_REPEATS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Trust this temporary container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Identical benchmark workload
        shell: bash
        run: node scripts/runner-benchmark.mjs 2>&1 | tee runner-benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-runner-benchmark
          path: |
            runner-benchmark-results.json
            runner-benchmark.log
          if-no-files-found: error
